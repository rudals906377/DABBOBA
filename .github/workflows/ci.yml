name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DABBOBA_ENVIRONMENT_TIER: TEST
      DABBOBA_API_URL: https://api.example.invalid
      ADMIN_SESSION_COOKIE_NAME: __Host-dabboba_admin_session
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Reject high and critical production dependency advisories
        run: pnpm run audit:prod

      - name: Verify workspace structure
        run: pnpm run workspace:assert

      - name: Verify mobile store metadata and fail-closed production gates
        run: pnpm run release:mobile:check -- --structure-only

      - name: Generate OpenAPI TypeScript contracts
        run: pnpm --filter @dabboba/contracts generate

      - name: Build all workspace packages and applications
        run: pnpm run build:all

      - name: Type-check all workspace packages and applications
        run: pnpm exec turbo run typecheck

      - name: Run package and customer-web unit tests
        run: pnpm exec turbo run test

      - name: Verify static hosting output
        run: pnpm run test:sites

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public storefront browser tests
        run: pnpm --filter @dabboba/storefront run test:browser

      - name: Run protected mobile-runtime browser tests
        run: pnpm run test:runtime

  cloud-run-artifacts:
    name: Cloud Run artifact checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Google Cloud CLI for local context checks
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: 580.0.0

      - name: Validate Cloud Run scripts, configs, contexts, and images
        run: bash ops/cloud-run/check-artifacts.sh --build

  database-migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Match the local/Supabase queue runtime and pin the reviewed image.
        image: tembo.docker.scarf.sh/tembo/pg17-pgmq@sha256:ba00a1ec2694b76be07b9bc5331e2bc0fa671f296919d2bb12a1cb2e22dd15fd
        env:
          POSTGRES_DB: dabboba_ci
          POSTGRES_USER: dabboba
          POSTGRES_PASSWORD: dabboba_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dabboba -d dabboba_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DABBOBA_ENVIRONMENT_TIER: TEST
      DATABASE_MIGRATION_URL: postgresql://dabboba:dabboba_ci_only@127.0.0.1:5432/dabboba_ci
      DABBOBA_TEST_DATABASE_URL: postgresql://dabboba:dabboba_ci_only@127.0.0.1:5432/dabboba_ci
      DABBOBA_RUNTIME_TEST_DATABASE_URL: postgresql://dabboba_runtime:dabboba_runtime_ci_only_32_bytes@127.0.0.1:5432/dabboba_ci
      DABBOBA_RUNTIME_DATABASE_PASSWORD: dabboba_runtime_ci_only_32_bytes
      DABBOBA_WORKER_TEST_DATABASE_URL: postgresql://dabboba_worker:dabboba_worker_ci_only_32_bytes_@127.0.0.1:5432/dabboba_ci
      DABBOBA_WORKER_DATABASE_PASSWORD: dabboba_worker_ci_only_32_bytes_
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify committed database release source
        run: pnpm run db:release-source:check

      - name: Build shared packages used by the migration CLI
        run: pnpm run workspace:packages

      - name: Provision Supabase-compatible roles in disposable PostgreSQL
        run: |
          psql "$DATABASE_MIGRATION_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            ELSE
              ALTER ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            ELSE
              ALTER ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL

      - name: Apply migrations to disposable PostgreSQL
        run: pnpm run db:migrate

      - name: Prove migration re-entry is a no-op
        run: pnpm run db:migrate

      - name: Provision the disposable runtime role login
        run: pnpm --filter @dabboba/db provision:runtime-role

      - name: Provision the disposable worker role login without command-line secrets
        run: printf '%s\n' "$DABBOBA_WORKER_DATABASE_PASSWORD" | pnpm --filter @dabboba/db provision:worker-role -- --password-stdin

      - name: Verify disposable release database separation
        env:
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_MIGRATION_URL }}
          DATABASE_URL: ${{ env.DABBOBA_RUNTIME_TEST_DATABASE_URL }}
          WORKER_DATABASE_URL: ${{ env.DABBOBA_WORKER_TEST_DATABASE_URL }}
          DABBOBA_RELEASE_ENVIRONMENT_TIER: TEST
        run: corepack pnpm --filter @dabboba/db check:release

      - name: Verify runtime database privileges
        env:
          DATABASE_URL: ""
        run: pnpm --filter @dabboba/db test

      - name: Build database integration suites
        run: |
          pnpm --filter @dabboba/api build
          pnpm --filter @dabboba/worker build

      - name: Run PostgreSQL-backed API integration tests
        env:
          DATABASE_URL: ""
          DABBOBA_RUNTIME_TEST_DATABASE_URL: ""
        run: pnpm --filter @dabboba/api test

      - name: Verify customer API routes with the runtime database role
        env:
          DATABASE_URL: ""
        run: node --test apps/api/dist/runtime-role-routes.integration.test.js

      - name: Run PostgreSQL-backed worker integration tests
        env:
          DATABASE_URL: ""
          WORKER_DATABASE_URL: ${{ env.DABBOBA_WORKER_TEST_DATABASE_URL }}
        run: pnpm --filter @dabboba/worker test
