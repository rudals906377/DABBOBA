services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dabboba
      POSTGRES_USER: dabboba
      POSTGRES_PASSWORD: dabboba_local
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - dabboba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dabboba -d dabboba"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - dabboba_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dabboba_postgres_data:
  dabboba_redis_data:
