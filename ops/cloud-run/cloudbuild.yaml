timeout: 1200s
steps:
  - name: gcr.io/cloud-builders/docker@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --pull
      - --target
      - ${_TARGET}
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
