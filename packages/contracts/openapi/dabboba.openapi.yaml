  /v1/kuji/rooms/{productId}/entries:
    post:
      tags: [Kuji, Commerce]
      operationId: joinKujiRoom
      description: Atomically reuses the viewer's active entry or joins the product FIFO. An empty room grants one non-renewing 180-second checkout lease.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Existing active entry returned without creating a duplicate.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Idempotent-Replay:
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KujiRoomSnapshot" }
        "201":
          description: Entry created as CHECKOUT_PENDING when free or WAITING when occupied.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KujiRoomSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/CommerceUnavailable" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/kuji/rooms/{productId}/entries/{entryId}:
    get:
      tags: [Kuji, Commerce]
      operationId: getOwnKujiRoomEntry
      description: Returns an uncached authoritative snapshot and atomically expires stale occupancy before promoting the next FIFO entry.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current room snapshot for the entry owner.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KujiRoomSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CommerceUnavailable" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
    delete:
      tags: [Kuji, Commerce]
      operationId: leaveOwnKujiRoomEntry
      description: Idempotently cancels an owned WAITING or CHECKOUT_PENDING entry, atomically cancels any linked unpaid order and releases its stock, points, and coupon, then promotes the next FIFO entry. DRAWING or payment-authorized/paid entries return conflict.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated room snapshot with the viewer's terminal state.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KujiRoomSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/CommerceUnavailable" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/kuji/rooms/{productId}/entries/{entryId}/slots:
    post:
      tags: [Kuji, Commerce]
      operationId: bindOwnPaidKujiSlots
      description: Atomically binds every paid available entitlement in the owned DRAWING or expired paid room to the same number of unique available sealed slots. Reusing the same idempotency key or exact existing binding is safe.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindKujiSlotsInput" }
      responses:
        "200":
          description: The exact previously committed binding was replayed.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Idempotent-Replay:
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KujiSlotBindingResult" }
        "201":
          description: All requested slots were bound atomically to paid entitlements.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KujiSlotBindingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/CommerceUnavailable" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
