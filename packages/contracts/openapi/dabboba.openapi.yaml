      operationId: getProductDrawOdds
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Current public, server-calculated odds for an active gacha or kuji product.
          headers:
            Cache-Control:
              description: Odds are never served from a client or intermediary cache.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicDrawOdds" }
