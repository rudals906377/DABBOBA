        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/payments/{paymentId}/confirm:
    post:
      tags: [Commerce]
      operationId: confirmOwnPortOnePayment
      description: Re-queries PortOne with the authenticated owner's payment ID and applies only the provider-authoritative state to the order. A client redirect or callback is never accepted as proof of payment.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Fresh provider state was reconciled, or the payment is still pending.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortOnePaymentConfirmation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502":
          description: PortOne could not be queried or its response failed contract validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: Commerce is unavailable in PRELAUNCH, or the PortOne production channel is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/payments/webhooks/portone:
    post:
      tags: [Commerce]
      operationId: receivePortOnePaymentWebhook
      description: Verifies the official PortOne webhook signature, then performs a fresh provider lookup before reconciling payment state. Webhook body status is never trusted directly.
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: webhook-signature
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: webhook-timestamp
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9]{1,16}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Official PortOne webhook envelope. The raw bytes are required for signature verification.
              additionalProperties: true
      responses:
        "202":
          description: Verified notification accepted and provider state reconciled or still pending.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Webhook body exceeds the bounded verification size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/CommerceUnavailable" }
  /v1/payments/webhooks/{provider}:
    post:
      tags: [Commerce]
      operationId: receivePaymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
        - name: x-dabboba-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentWebhookInput" }
      responses:
        "202": { description: Verified event accepted or previously processed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/CommerceUnavailable" }
