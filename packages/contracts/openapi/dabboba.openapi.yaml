        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/orders/{orderId}/draw-recovery:
    get:
