openapi: 3.1.0
info:
  title: DABBOBA API
  version: 0.1.0
  description: Shared user, commerce, and privileged operations contract. Fixture-only prototype behavior is not represented as production persistence.
servers:
  - url: http://127.0.0.1:8788
    description: Isolated local API
tags:
  - name: Auth
  - name: Media
  - name: Catalog
  - name: Exchange
  - name: Community
  - name: Commerce
  - name: Kuji
  - name: Account
  - name: Admin
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The API process is alive. No external dependency is queried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: PostgreSQL is ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /v1/public/config:
    get:
      tags: [Catalog, Auth, Commerce]
      operationId: getPublicConfig
      description: Public launch capability and exact legal versions required by customer clients. Clients must intersect commerceMode with their compile-time capability and may never upgrade a PRELAUNCH build to LIVE locally.
      responses:
        "200":
          description: Server-authoritative public application configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }
  /v1/demo/capabilities:
    get:
      tags: [Commerce]
      operationId: getLocalDemoCapabilities
      description: Loopback-only discovery for the isolated internal commerce test profile. This route is unavailable in production.
      responses:
        "200":
          description: Local single-customer session and payment transition capabilities.
  /v1/demo/session:
    post:
      tags: [Commerce]
      operationId: createLocalDemoSession
      description: Creates a session for the one isolated internal customer account. No account selector is accepted. This route is unavailable in production.
      responses:
        "201":
          description: Local internal customer session created.
  /v1/demo/payments/{orderId}/transition:
    post:
      tags: [Commerce]
      operationId: transitionLocalDemoPayment
      description: Drives a loopback-only TEST_PG payment through the same verified webhook path used by the internal commerce test profile. This route is unavailable in production.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [approve, cancel, fail, refund] }
      responses:
        "200":
          description: Updated local demo order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/auth/providers:
    get:
      tags: [Auth]
      operationId: getCustomerLoginProviders
      description: Returns the supported customer login methods and whether server-side Supabase token exchange is configured.
      responses:
        "200":
          description: Customer login provider discovery.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerLoginProviders" }
  /v1/auth/exchange:
    post:
      tags: [Auth]
      operationId: exchangeCustomerAccessToken
      description: Verifies an asymmetric Supabase access token and the live Auth user for Kakao, Naver, Google, Apple, or email OTP identities, then returns an opaque DABBOBA session. Multiple allowed identities automatically linked by Supabase reuse one DABBOBA account only when they share the exact broker issuer and subject. Matching email strings never merge different broker subjects.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerAccessTokenExchangeInput" }
      responses:
        "201":
          description: DABBOBA customer session created.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428":
          description: Exact currently published policy versions must be explicitly accepted before a session is issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalAcceptanceRequiredErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Supabase customer token exchange is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/auth/account-deletion-exchange:
    post:
      tags: [Auth]
      operationId: exchangeExistingCustomerForAccountDeletion
      description: Verifies a live Supabase social-provider session for an already linked DABBOBA customer and issues an ephemeral customer session used by the public account-deletion flow. This endpoint never creates a user or links an unknown provider subject.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeletionAccessTokenExchangeInput" }
      responses:
        "201":
          description: Existing customer verified for the account-deletion flow.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Supabase customer token exchange or Apple revocation credential protection is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/auth/dev-session:
    post:
      tags: [Auth]
      operationId: createDevelopmentSession
      description: Development-only user session. The API refuses this route outside development and test.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUserSession
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user actor and active session metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSessionState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshUserSession
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Current session revoked and replaced with a newly issued user session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSessionIssued" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Current user session revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/logout-others:
    post:
      tags: [Auth]
      operationId: logoutOtherUserSessions
      description: Revokes every other user session for this account while preserving the authenticated current session. Repeating the request is safe.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: All other user sessions are revoked or were already revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/admin/auth/login:
    post:
      tags: [Admin, Auth]
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        "201":
          description: Privileged session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/admin/auth/logout:
    post:
      tags: [Admin, Auth]
      operationId: logoutAdmin
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/admin/me:
    get:
      tags: [Admin]
      operationId: getAdminActor
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current privileged actor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Actor" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/notices:
    get:
      tags: [Community]
      operationId: listPublishedNotices
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Published notices ordered by pinned state and recency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticePage" }
  /v1/media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUploadIntent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMediaUploadInput" }
      responses:
        "201":
          description: Short-lived staging upload capability using a negotiated multipart POST policy or raw PUT request. Clients that omit acceptedUploadMethods receive POST only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadIntent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Per-user active, daily, or retained media count/byte quota exceeded. }
        "503": { description: Media storage is not configured. }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/media/{mediaId}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Bytes, checksum, MIME, decode limits, and dimensions verified; orientation normalized and metadata stripped through WebP re-encoding into an immutable object generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaReady" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Per-user image processing concurrency exceeded. }
        "503": { description: API instance image processing capacity is busy. }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The durable upload intent expired and the client must create a new upload intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadIntentExpiredErrorEnvelope" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/media/{mediaId}:
    delete:
      tags: [Media]
      operationId: deleteOwnUnattachedMedia
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Owned, unattached media was marked deleted; repeating the same idempotency key is safe.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The authenticated account is not allowed to mutate data, including after account-deletion approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Media does not exist or is not owned by the authenticated user; ownership is not disclosed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Media is attached to durable content and cannot be deleted directly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/media/{mediaId}/url:
    get:
      tags: [Media]
      operationId: getOwnMediaUrl
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Short-lived URL for media owned by the current actor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaReadUrl" }
        "404": { $ref: "#/components/responses/NotFound" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/media/{mediaId}/public-url:
    get:
      tags: [Media]
      operationId: getPublicPostMediaUrl
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Short-lived URL only when the media belongs to a visible community post.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaReadUrl" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/media/{mediaId}/url:
    get:
      tags: [Admin, Media]
      operationId: getAdminMediaUrl
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Short-lived URL for privileged review of an attachment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaReadUrl" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/catalog-media/uploads:
    post:
      tags: [Admin, Media]
      operationId: createAdminCatalogMediaUploadIntent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminReason"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogMediaUploadInput" }
      responses:
        "201":
          description: Short-lived private staging upload capability for an administrator-owned CATALOG image. The server refuses to create the intent unless both image processing and the trusted catalog delivery base are configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadIntent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Per-administrator active, daily, or retained media quota exceeded. }
        "503": { description: Image processing, private storage, or stable catalog delivery is unavailable. }
  /v1/admin/catalog-media/{mediaId}/complete:
    post:
      tags: [Admin, Media]
      operationId: completeAdminCatalogMediaUpload
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminReason"
      responses:
        "200":
          description: The owned CATALOG image is verified, decoded, metadata-stripped, and committed as immutable WebP media.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaReady" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The durable upload intent expired and a new upload intent is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadIntentExpiredErrorEnvelope" }
        "429": { description: Per-administrator image processing concurrency exceeded. }
        "503": { description: API image processing is unavailable or busy. }
  /v1/admin/catalog-media/{mediaId}:
    delete:
      tags: [Admin, Media]
      operationId: deleteAdminCatalogMedia
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminReason"
      responses:
        "204": { description: Unattached administrator-owned CATALOG media was marked deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Once attached, catalog media is retained permanently to protect current and historical snapshot references. }
  /v1/admin/catalog-media/{mediaId}/url:
    get:
      tags: [Admin, Media]
      operationId: getAdminCatalogMediaUrl
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Short-lived preview URL for owned READY CATALOG media.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaReadUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/catalog/media/{mediaId}/image:
    get:
      tags: [Catalog, Media]
      operationId: getPublishedCatalogMediaImage
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "302":
          description: Redirects only referenced READY CATALOG media to a fresh short-lived private-storage signed read URL.
          headers:
            Location:
              schema: { type: string, format: uri }
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Stable catalog delivery is not configured. }
  /v1/inquiries:
    get:
      tags: [Community]
      operationId: listOwnInquiries
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Authenticated user's inquiries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
    post:
      tags: [Community]
      operationId: createInquiry
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInquiryInput" }
      responses:
        "201":
          description: Inquiry created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inquiry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/inquiries/{inquiryId}:
    get:
      tags: [Community]
      operationId: getOwnInquiry
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/InquiryId"
      responses:
        "200":
          description: Inquiry with its conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/inquiries/{inquiryId}/messages:
    post:
      tags: [Community]
      operationId: addInquiryMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/InquiryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInquiryMessageInput" }
      responses:
        "201":
          description: User follow-up added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryMessage" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/community/posts:
    get:
      tags: [Community]
      operationId: listCommunityPosts
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: ipId
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Visible community posts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPostPage" }
    post:
      tags: [Community]
      operationId: createCommunityPost
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommunityPostInput" }
      responses:
        "201":
          description: Post created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/community/posts/{postId}:
    get:
      tags: [Community]
      operationId: getCommunityPost
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Visible post detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Community]
      operationId: updateCommunityPost
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCommunityPostInput" }
      responses:
        "200":
          description: Author-owned active post updated after a version check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
    delete:
      tags: [Community]
      operationId: deleteCommunityPost
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedVersionInput" }
      responses:
        "200":
          description: Author-owned post soft-deleted after a version check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPostDeletionResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/LegalAcceptanceRequired" }
  /v1/community/posts/{postId}/like:
    post:
      tags: [Community]
      operationId: setCommunityPostLike
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
