        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminReason"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminRefundReviewInput" }
      responses:
        "200":
          description: Refund review status and note committed; no provider refund action is executed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRefundReviewMutationResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/commerce/inventory:
    get:
      tags: [Admin, Commerce]
      operationId: listAdminInventory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ProductCategory" }
      responses:
        "200":
          description: Product stock and active draw-capacity summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInventoryPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/commerce/inventory/{productId}:
    get:
      tags: [Admin, Commerce]
      operationId: getAdminInventory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Stock adjustment ledger and reservations for one product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInventoryDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/commerce/inventory/{productId}/adjustments:
    post:
      tags: [Admin, Commerce]
      operationId: adjustAdminInventory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminReason"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustAdminInventoryInput" }
      responses:
        "200":
          description: Stock adjustment committed to the append-only ledger after version and draw-capacity checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInventoryAdjustmentResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/commerce/shipping:
    get:
      tags: [Admin, Commerce]
      operationId: listAdminShippingRequests
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AdminShippingStatus" }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Shipping operations queue without destination details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminShippingRequestPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/commerce/shipping/{shippingRequestId}:
    get:
      tags: [Admin, Commerce]
      operationId: getAdminShippingRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShippingRequestId"
      responses:
        "200":
          description: Shipping request destination, items, and status event ledger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminShippingRequestDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/commerce/shipping/{shippingRequestId}/status:
    post:
      tags: [Admin, Commerce]
      operationId: updateAdminShippingStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShippingRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminReason"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminShippingStatusInput" }
      responses:
        "200":
          description: Allowed shipping state transition committed and audited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminShippingStatusResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/audit-logs:
    get:
      tags: [Admin]
      operationId: listAdminAuditLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Append-only privileged operation history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLogPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 500 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    Search:
      name: q
      in: query
      schema: { type: string, maxLength: 120 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    AdminReason:
      name: X-Admin-Reason
      in: header
      required: true
      description: ASCII reasons remain compatible. For non-ASCII text, percent-encode UTF-8 and also send X-Admin-Reason-Encoding as utf-8-percent.
      schema: { type: string, minLength: 2, maxLength: 1000 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WantedRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountDeletionRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        maxLength: 120
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShippingRequestId:
      name: shippingRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Request input is malformed or references an inactive catalog item.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Authentication is required or the session is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    LegalAcceptanceRequired:
      description: The authenticated user must explicitly accept the exact currently published terms and privacy versions before this operation can continue.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegalAcceptanceRequiredErrorEnvelope" }
    Forbidden:
      description: The authenticated actor lacks the required role or ownership.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: The visible resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: The requested state transition conflicts with committed state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many attempts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    CommerceUnavailable:
      description: Commerce is disabled for the PRELAUNCH release. Customer-facing endpoints perform no new order, payment, draw, kuji-room, point-return, exchange, inventory, or shipping mutation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status: { type: string, const: ok }
        timestamp: { type: string, format: date-time }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, database, timestamp]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        database: { type: string, enum: [ok, unavailable] }
        timestamp: { type: string, format: date-time }
    CommerceLaunchMode:
      type: string
      enum: [PRELAUNCH, LIVE]
    RequiredPolicyVersions:
      type: object
      additionalProperties: false
      required: [terms, privacy]
      properties:
        terms: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        privacy: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    PublicConfig:
      type: object
      additionalProperties: false
      required: [commerceMode, requiredPolicyVersions]
      properties:
        commerceMode: { $ref: "#/components/schemas/CommerceLaunchMode" }
        requiredPolicyVersions: { $ref: "#/components/schemas/RequiredPolicyVersions" }
    CustomerAuthProvider:
      type: string
      enum: [KAKAO, NAVER, GOOGLE, APPLE, EMAIL]
    CustomerLoginProviders:
      type: object
      additionalProperties: false
      required: [methods, brokerExchangeConfigured, requiredPolicyVersions]
      properties:
        methods:
          type: array
          minItems: 0
          maxItems: 5
          uniqueItems: true
          items: { $ref: "#/components/schemas/CustomerAuthProvider" }
        brokerExchangeConfigured: { type: boolean }
        requiredPolicyVersions:
          type: object
          additionalProperties: false
          required: [terms, privacy]
          properties:
            terms: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
            privacy: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    CustomerAccessTokenExchangeInput:
      type: object
      additionalProperties: false
      required: [accessToken, acceptedPolicies, loginProvider]
      properties:
        accessToken: { type: string, minLength: 64, maxLength: 16384, writeOnly: true }
        loginProvider: { $ref: "#/components/schemas/CustomerAuthProvider" }
        appleRefreshToken:
          type: string
          minLength: 32
          maxLength: 16384
          writeOnly: true
          description: Required only for Apple login. Supabase provider refresh token sent once to the trusted API for encrypted deletion-revocation storage.
        acceptedPolicies:
          type: object
          additionalProperties: false
          required: [terms, privacy]
          properties:
            terms: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
            privacy: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    AccountDeletionAccessTokenExchangeInput:
      type: object
      additionalProperties: false
      required: [accessToken, acceptedPolicies, loginProvider]
      properties:
        accessToken: { type: string, minLength: 64, maxLength: 16384, writeOnly: true }
        loginProvider: { type: string, enum: [KAKAO, NAVER, GOOGLE, APPLE] }
        appleRefreshToken:
          type: string
          minLength: 32
          maxLength: 16384
          writeOnly: true
          description: Optional fresh Apple provider refresh token. When absent, an existing encrypted revocation credential is required.
        acceptedPolicies: { $ref: "#/components/schemas/RequiredPolicyVersions" }
    CurrentPolicyAcceptanceInput:
      type: object
      additionalProperties: false
      required: [acceptedPolicies]
      properties:
        acceptedPolicies:
          type: object
          additionalProperties: false
          required: [terms, privacy]
          properties:
            terms: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
            privacy: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
    LegalAcceptanceRequiredErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, details]
          properties:
            code: { type: string, const: LEGAL_ACCEPTANCE_REQUIRED }
            message: { type: string }
            requestId: { type: string }
            details:
              type: object
              additionalProperties: false
              required: [requiredPolicyVersions]
              properties:
                requiredPolicyVersions: { $ref: "#/components/schemas/RequiredPolicyVersions" }
    MediaUploadIntentExpiredErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string, const: MEDIA_UPLOAD_INTENT_EXPIRED }
            message: { type: string }
            requestId: { type: string }
    UserRole: { type: string, enum: [USER, ADMIN, SUPER_ADMIN] }
    UserStatus: { type: string, enum: [ACTIVE, SUSPENDED, BANNED, DELETED] }
    ContentStatus: { type: string, enum: [ACTIVE, HIDDEN, DELETED] }
    InquiryStatus: { type: string, enum: [PENDING, IN_PROGRESS, ANSWERED, CLOSED] }
    ReportStatus: { type: string, enum: [PENDING, REVIEWING, RESOLVED, REJECTED] }
    RequestStatus: { type: string, enum: [PENDING, APPROVED, REJECTED, ON_HOLD, MERGED] }
    ProductCategory: { type: string, enum: [gacha, figure, kuji, tcg] }
    ProductSaleStatus: { type: string, enum: [DRAFT, COMING_SOON, ON_SALE, PAUSED] }
    ProductPurchaseBlockedReason:
      type: [string, "null"]
      enum: [DRAFT, COMING_SOON, PAUSED, COMMERCE_PRELAUNCH, OUT_OF_STOCK, null]
    StorefrontCategoryAvailability: { type: string, enum: [active, coming-soon, hidden] }
    MediaPurpose: { type: string, enum: [PROFILE, POST, COMMENT, INQUIRY, EXCHANGE, CATALOG_REQUEST, WANTED_REQUEST] }
    MediaMimeType: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif] }
    CreateMediaUploadInput:
      type: object
      additionalProperties: false
      required: [purpose, filename, mimeType, byteSize, checksumSha256]
      properties:
        purpose: { $ref: "#/components/schemas/MediaPurpose" }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { $ref: "#/components/schemas/MediaMimeType" }
        byteSize: { type: integer, minimum: 1, maximum: 10485760 }
        checksumSha256: { type: string, pattern: "^[0-9A-Fa-f]{64}$" }
        acceptedUploadMethods:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [POST, PUT] }
          description: Supported upload transports. Defaults to [POST] when omitted, preserving legacy multipart POST behavior; PUT means an exact raw file body, never multipart. The property remains optional in generated clients.
    CreateCatalogMediaUploadInput:
      type: object
      additionalProperties: false
      required: [filename, mimeType, byteSize, checksumSha256, acceptedUploadMethods]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { $ref: "#/components/schemas/MediaMimeType" }
        byteSize: { type: integer, minimum: 1, maximum: 10485760 }
        checksumSha256: { type: string, pattern: "^[0-9A-Fa-f]{64}$" }
        acceptedUploadMethods:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [POST, PUT] }
          description: Admin clients negotiate both transports. CATALOG is fixed server-side and is never accepted from caller input.
    MediaUploadIntent:
      oneOf:
        - $ref: "#/components/schemas/MediaMultipartPostUploadIntent"
        - $ref: "#/components/schemas/MediaRawPutUploadIntent"
      discriminator:
        propertyName: method
        mapping:
          POST: "#/components/schemas/MediaMultipartPostUploadIntent"
          PUT: "#/components/schemas/MediaRawPutUploadIntent"
    MediaMultipartPostUploadIntent:
      type: object
      additionalProperties: false
      required: [mediaId, uploadUrl, method, fields, fileFieldName, expiresAt, maxBytes]
      properties:
        mediaId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method: { type: string, const: POST }
        fields:
          type: object
          minProperties: 1
          additionalProperties: { type: string }
          description: Append every field to multipart FormData before appending the file.
        fileFieldName: { type: string, const: file }
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer, minimum: 1, maximum: 10485760, description: Exact declared byte size enforced by the signed policy. }
    MediaRawPutUploadIntent:
      type: object
      additionalProperties: false
      required: [mediaId, uploadUrl, method, bodyEncoding, headers, expiresAt, maxBytes]
      properties:
        mediaId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method: { type: string, const: PUT }
        bodyEncoding: { type: string, const: raw }
        headers:
          type: object
          minProperties: 5
          maxProperties: 5
          additionalProperties: { type: string }
          description: Required signed headers are content-type (declared MIME), content-length (exact byte size), x-amz-content-sha256 (UNSIGNED-PAYLOAD), x-amz-meta-sha256 (declared SHA-256), and x-amz-meta-media-id (this mediaId). Reject other headers or mismatched values. Validate content-length but let the browser/native transport derive it from the exact raw body; never forward application credentials or cookies.
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer, minimum: 1, maximum: 10485760, description: Exact declared byte size bound to the signed request and independently verified at completion. }
    MediaReady:
      type: object
      additionalProperties: false
      required: [mediaId, status, mimeType]
      properties:
        mediaId: { type: string, format: uuid }
        status: { type: string, const: READY }
        mimeType: { type: string, const: image/webp }
    MediaReadUrl:
      type: object
      additionalProperties: false
      required: [mediaId, url, expiresAt, mimeType]
      properties:
        mediaId: { type: string, format: uuid }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        mimeType: { $ref: "#/components/schemas/MediaMimeType" }
    ProductImageAttachInput:
      type: object
      additionalProperties: false
      required: [mediaId, expectedVersion]
      properties:
        mediaId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        role:
          description: primary는 기존 상세·기본 대표 사진이고 storefront는 상품 목록 전용 사진입니다.
          allOf:
            - type: string
              enum: [primary, storefront]
              default: primary
    ProductImageAttachment:
      type: object
      additionalProperties: false
      required: [productId, imageUrl, version, mediaId, role]
      properties:
        productId:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        imageUrl: { type: string, format: uri }
        version: { type: integer, minimum: 2 }
        mediaId: { type: string, format: uuid }
        role: { type: string, enum: [primary, storefront] }
    ProductImageClearInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, role]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        role: { type: string, enum: [storefront] }
    ProductImageClearResult:
      type: object
      additionalProperties: false
      required: [productId, imageUrl, version, role]
      properties:
        productId:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        imageUrl: { type: "null" }
        version: { type: integer, minimum: 2 }
        role: { type: string, enum: [storefront] }
    Actor:
      type: object
      additionalProperties: false
      required: [userId, email, nickname, role, status, sessionId, permissions]
      properties:
        userId: { type: string, format: uuid }
        email: { type: [string, "null"], format: email }
        nickname: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        sessionId: { type: string, format: uuid }
        permissions: { type: array, items: { type: string } }
    FavoriteIpSummary:
      type: object
      additionalProperties: false
      required: [id, nameKo, imageUrl]
      properties:
        id: { type: string, maxLength: 120 }
        nameKo: { type: string }
        imageUrl: { type: [string, "null"], format: uri }
    AccountProfile:
      type: object
      additionalProperties: false
      required: [id, nickname, bio, favoriteIp, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, minLength: 1, maxLength: 40 }
        bio: { type: [string, "null"], maxLength: 500 }
        favoriteIp:
          oneOf:
            - $ref: "#/components/schemas/FavoriteIpSummary"
            - type: "null"
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    UpdateAccountProfileInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 40 }
        bio: { type: [string, "null"], maxLength: 500 }
        favoriteIpId: { type: [string, "null"], maxLength: 120, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        expectedVersion: { type: integer, minimum: 1 }
    AccountBasicInfo:
      type: object
      additionalProperties: false
      required: [id, nickname, email, phoneMasked, birthDate, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, minLength: 1, maxLength: 40 }
        email: { type: [string, "null"], format: email }
        phoneMasked: { type: [string, "null"], maxLength: 32 }
        birthDate: { type: [string, "null"], format: date }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    UpdateAccountBasicInfoInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 40 }
        birthDate: { type: [string, "null"], format: date }
        expectedVersion: { type: integer, minimum: 1 }
    DefaultShippingAddress:
      type: object
      additionalProperties: false
      required: [id, recipient, phone, postalCode, addressLine1, addressLine2, deliveryNote, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        recipient: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, pattern: "^\\+?[0-9]{8,15}$" }
        postalCode: { type: string, minLength: 3, maxLength: 12 }
        addressLine1: { type: string, minLength: 1, maxLength: 200 }
        addressLine2: { type: [string, "null"], maxLength: 200 }
        deliveryNote: { type: [string, "null"], maxLength: 200 }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    UpsertDefaultShippingAddressInput:
      type: object
      additionalProperties: false
      required: [recipient, phone, postalCode, addressLine1]
      properties:
